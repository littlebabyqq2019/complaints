name: 打包统信/麒麟 Linux 可执行文件（x86_64 + aarch64）

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'README*'
      - '使用说明.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.arch }}（低 glibc 基线）
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu:18.04 = glibc 2.27，产物可在 glibc >= 2.28 的
          # 麒麟 V10 SP1/SP2/SP3、统信 UOS 20 全系运行
          - arch: x86_64
            image: amd64/ubuntu:18.04
            platform: linux/amd64
          - arch: aarch64
            image: arm64v8/ubuntu:18.04
            platform: linux/arm64
    runs-on: ubuntu-22.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 启用 QEMU（仅 aarch64 需要）
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 在 glibc 2.27 容器内编译 Python 3.10 并打包
        run: |
          chmod +x .github/scripts/build-in-container.sh
          docker run --rm --platform "${{ matrix.platform }}" \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            -e DEBIAN_FRONTEND=noninteractive \
            "${{ matrix.image }}" \
            bash /src/.github/scripts/build-in-container.sh "${{ matrix.arch }}"

      - name: 上传构建产物（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: complaints-linux-${{ matrix.arch }}
          path: |
            dist/complaints-linux-${{ matrix.arch }}.tar.gz
            dist/complaints-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: 汇总双架构产物并发布 Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: 下载两个架构的构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: complaints-linux-*
          merge-multiple: true
          path: dist

      - name: 列出发布件
        run: ls -lh dist

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linux-v${{ github.run_number }}-compat
          name: 统信/麒麟 Linux 版 v${{ github.run_number }}（兼容 glibc 2.28+）
          body: |
            自动构建：统信 UOS / 麒麟 Kylin V10 可执行文件，两个 CPU 架构各自原生打包，
            并在 glibc 2.27 容器内编译 Python 3.10，产物不依赖 GLIBC_2.34/2.35，
            可在麒麟 V10 SP1 及以上、统信 UOS 20 全系直接运行。

            - x86_64（Intel/AMD、兆芯、海光）：complaints-linux-x86_64.tar.gz
            - aarch64（飞腾、鲲鹏、麒麟芯、瑞芯微）：complaints-linux-aarch64.tar.gz

            请按 `uname -m` 选择对应包。解压后务必执行 `./启动GUI.sh`（必须带 `./`）。
            启动器会检查架构、glibc、动态库和图形环境，并把错误写入 AppData/启动诊断.log，
            不再出现"双击没反应"。

            **不需要在目标机器上安装 Python**：包内自带 Python 3.10 运行时、Tk/Tcl 和全部依赖。
            系统只需预装 libreoffice-writer（或 WPS）、cups-client、fonts-noto-cjk、xdg-utils。
          files: |
            dist/*.tar.gz
            dist/*.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
