name: 打包统信/麒麟 Linux 可执行文件

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建 Linux amd64 可执行文件
    # ubuntu-22.04 的 glibc 2.35 与统信 UOS 20 / 麒麟 V10 SP1 兼容
    runs-on: ubuntu-22.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装系统依赖（Tk / 中文字体 / LibreOffice / CUPS）
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            python3-tk tk8.6-blt2.5 \
            fonts-noto-cjk fonts-wqy-microhei fonts-arphic-uming \
            libreoffice-writer cups-client xdg-utils

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          # 3.10 兼容的纯净依赖集合（含打包器）
          pip install "pdfplumber==0.11.0" "python-docx==1.1.0" \
            "openpyxl>=3.1.0" "Pillow>=10.0.0" "ttkbootstrap>=1.10.1" \
            "PyPDF2>=3.0.0" "pypinyin>=0.50.0" "qrcode>=7.4.2" \
            "pyinstaller>=6.5.0"

      - name: 语法与导入校验
        run: |
          python -m py_compile gui_app.py main.py database.py rule_engine.py \
            rule_management_ui.py platform_compat.py
          python -c "import platform_compat, main, database, rule_engine, rule_management_ui; print('模块导入通过')"
          python -c "from PyPDF2 import PdfWriter; print('PdfWriter 可用')"
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: PyInstaller 打包（onedir）
        run: |
          pyinstaller complaints-linux.spec --noconfirm
          chmod +x "dist/投诉批办单管理系统/投诉批办单管理系统"

      - name: 生成桌面入口与说明
        run: |
          OUT="dist/投诉批办单管理系统"
          chmod +x "$OUT/投诉批办单管理系统"
          cp 启动GUI.sh "$OUT/启动GUI.sh"
          chmod +x "$OUT/启动GUI.sh"
          cp 投诉批办单管理系统.desktop "$OUT/投诉批办单管理系统.desktop"
          cp 使用说明.txt "$OUT/使用说明.txt"
          cp 1.png "$OUT/1.png"

      - name: 打包为 tar.gz 发布件
        run: |
          cd dist
          tar -czf "投诉批办单管理系统-Linux-x86_64.tar.gz" "投诉批办单管理系统"
          sha256sum "投诉批办单管理系统-Linux-x86_64.tar.gz" > "投诉批办单管理系统-Linux-x86_64.tar.gz.sha256"
          ls -lh

      - name: 上传构建产物（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: complaints-linux-x86_64
          path: |
            dist/投诉批办单管理系统-Linux-x86_64.tar.gz
            dist/投诉批办单管理系统-Linux-x86_64.tar.gz.sha256
          if-no-files-found: error

      - name: 创建 GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linux-v${{ github.run_number }}
          name: 统信/麒麟 Linux 版 v${{ github.run_number }}
          body: |
            自动构建：统信 UOS / 麒麟 Kylin V10（x86_64）可执行文件。
            解压后运行 `./投诉批办单管理系统` 或双击 `启动GUI.sh`。
            系统需预装 libreoffice-writer、cups-client 与 fonts-noto-cjk。
          files: |
            dist/投诉批办单管理系统-Linux-x86_64.tar.gz
            dist/投诉批办单管理系统-Linux-x86_64.tar.gz.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
